<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备信息检测</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f1220; color: #e0e0e0; padding: 30px; max-width: 800px; margin: 0 auto; }
  h1 { color: #fff; text-align: center; }
  .card { background: #1c2030; border-radius: 12px; padding: 20px 25px; margin: 15px 0; }
  .card h3 { color: #667eea; margin-top: 0; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2e40; }
  .row:last-child { border-bottom: none; }
  .label { color: #999; }
  .value { color: #fff; font-weight: bold; text-align: right; max-width: 60%; word-break: break-all; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 8px; }
  .badge-api { background: #667eea; color: #fff; }
  .badge-ua { background: #764ba2; color: #fff; }
  .copy-btn { display: block; margin: 20px auto; padding: 12px 30px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
  .copy-btn:hover { transform: scale(1.05); }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #667eea; color: #fff; padding: 10px 25px; border-radius: 20px; display: none; }
</style>
</head>
<body>

<h1>📱 设备 & 浏览器信息</h1>

<div class="card" id="browser-info">
  <h3>🌐 浏览器</h3>
  <div class="row"><span class="label">浏览器</span><span class="value" id="browser">检测中...</span></div>
  <div class="row"><span class="label">版本</span><span class="value" id="version">检测中...</span></div>
  <div class="row"><span class="label">语言</span><span class="value" id="lang"></span></div>
  <div class="row"><span class="label">Cookie</span><span class="value" id="cookie"></span></div>
  <div class="row"><span class="label">User Agent</span><span class="value" id="ua"></span></div>
</div>

<div class="card" id="system-info">
  <h3>💻 系统与硬件</h3>
  <div class="row"><span class="label">操作系统</span><span class="value" id="os">检测中...<span class="badge badge-api">API</span></span></div>
  <div class="row"><span class="label">系统版本</span><span class="value" id="os-version">检测中...</span></div>
  <div class="row"><span class="label">架构</span><span class="value" id="arch">检测中...</span></div>
  <div class="row"><span class="label">设备型号</span><span class="value" id="model">检测中...</span></div>
  <div class="row"><span class="label">屏幕分辨率</span><span class="value" id="screen"></span></div>
  <div class="row"><span class="label">像素比</span><span class="value" id="pixel-ratio"></span></div>
  <div class="row"><span class="label">CPU 核心</span><span class="value" id="cores"></span></div>
  <div class="row"><span class="label">内存</span><span class="value" id="memory"></span></div>
  <div class="row"><span class="label">时区</span><span class="value" id="timezone"></span></div>
  <div class="row"><span class="label">当前时间</span><span class="value" id="time"></span></div>
</div>

<div class="card" id="network-info">
  <h3>📡 网络</h3>
  <div class="row"><span class="label">连接类型</span><span class="value" id="conn-type"></span></div>
  <div class="row"><span class="label">下行速度</span><span class="value" id="downlink"></span></div>
  <div class="row"><span class="label">RTT</span><span class="value" id="rtt"></span></div>
  <div class="row"><span class="label">IP 地址</span><span class="value" id="ip">点击按钮获取</span></div>
</div>

<div class="card" id="gpu-info">
  <h3>🎮 GPU</h3>
  <div class="row"><span class="label">显卡型号</span><span class="value" id="gpu">检测中...</span></div>
</div>

<button class="copy-btn" onclick="copyAll()">📋 复制全部信息</button>
<button class="copy-btn" onclick="getIP()">🌍 获取 IP</button>

<div id="toast">已复制！</div>

<script>
// ========== userAgentData 优先 + UA 兜底 ==========
async function detectAll() {
  let osName = '未知', osVer = '未知', arch = '未知', model = '未知';
  let browserName = '未知', browserVer = '未知';
  let source = 'ua'; // 标记数据来源

  // --- 1. 优先用 userAgentData ---
  if (navigator.userAgentData) {
    source = 'api';
    const d = await navigator.userAgentData.getHighEntropyValues([
      'platform', 'platformVersion', 'architecture', 'bitness', 'model', 'fullVersionList'
    ]);

    osName = d.platform || '未知';
    osVer = d.platformVersion || '未知';
    arch = d.architecture + (d.bitness ? ('-' + d.bitness) : '');
    model = d.model || '未知';

    // 浏览器信息
    if (d.fullVersionList && d.fullVersionList.length > 0) {
      // 取第一个非 Chromium 的条目作为浏览器
      const brands = d.fullVersionList;
      const main = brands.find(b => b.brand !== 'Chromium' && b.brand !== 'Not A(Brand') || brands[0];
      browserName = main.brand;
      browserVer = main.version;
    }

    // 更新 badge 标记
    document.querySelectorAll('.badge-api').forEach(b => { b.textContent = 'API'; b.style.background = '#22c55e'; });
  }

  // --- 2. UA 兜底（Firefox/Safari/老浏览器） ---
  if (source === 'ua') {
    const ua = navigator.userAgent;

    // 操作系统
    if (ua.includes('Windows NT 10.0')) osName = 'Windows'; osVer = '10/11';
    else if (ua.includes('Windows NT 6.3')) { osName = 'Windows'; osVer = '8.1'; }
    else if (ua.includes('Windows NT 6.2')) { osName = 'Windows'; osVer = '8'; }
    else if (ua.includes('Windows NT 6.1')) { osName = 'Windows'; osVer = '7'; }
    else if (ua.includes('Windows NT 6.0')) { osName = 'Windows'; osVer = 'Vista'; }
    else if (ua.includes('Windows NT 5.1')) { osName = 'Windows'; osVer = 'XP'; }
    else if (ua.includes('Windows NT 5.0')) { osName = 'Windows'; osVer = '2000'; }
    else if (ua.includes('Mac OS X')) { osName = 'macOS'; osVer = ua.match(/Mac OS X ([0-9_]+)/)?.[1]?.replace(/_/g, '.') || '未知'; }
    else if (ua.includes('Android')) { osName = 'Android'; osVer = ua.match(/Android\s([0-9.]+)/)?.[1] || '未知'; }
    else if (ua.includes('iPhone')) { osName = 'iOS'; osVer = ua.match(/OS\s([0-9_]+)/)?.[1]?.replace(/_/g, '.') || '未知'; }
    else if (ua.includes('iPad')) { osName = 'iPadOS'; osVer = ua.match(/OS\s([0-9_]+)/)?.[1]?.replace(/_/g, '.') || '未知'; }
    else if (ua.includes('Linux')) { osName = 'Linux'; osVer = '未知'; }
    else if (ua.includes('CrOS')) { osName = 'ChromeOS'; osVer = '未知'; }

    // 架构
    if (ua.includes('x86_64') || ua.includes('Win64') || ua.includes('x64')) arch = 'x86-64';
    else if (ua.includes('ARM')) arch = 'ARM';
    else if (ua.includes('aarch64')) arch = 'ARM64';
    else if (ua.includes('WOW64')) arch = 'x86-64 (WOW64)';
    else arch = 'x86 (32-bit)';

    // 浏览器
    if (ua.includes('Edg/')) { browserName = 'Edge'; browserVer = ua.match(/Edg\/([0-9.]+)/)?.[1] || ''; }
    else if (ua.includes('Chrome/')) { browserName = 'Chrome'; browserVer = ua.match(/Chrome\/([0-9.]+)/)?.[1] || ''; }
    else if (ua.includes('Firefox/')) { browserName = 'Firefox'; browserVer = ua.match(/Firefox\/([0-9.]+)/)?.[1] || ''; }
    else if (ua.includes('Safari/') && !ua.includes('Chrome')) { browserName = 'Safari'; browserVer = ua.match(/Version\/([0-9.]+)/)?.[1] || ''; }
    else if (ua.includes('OPR/') || ua.includes('Opera/')) { browserName = 'Opera'; browserVer = ua.match(/(?:OPR|Opera)\/([0-9.]+)/)?.[1] || ''; }

    // 标记兜底
    document.querySelectorAll('.badge-api').forEach(b => { b.textContent = 'UA兜底'; b.style.background = '#f59e0b'; });
  }

  // --- 3. 填充页面 ---
  document.getElementById('os').innerHTML = osName + (source === 'api' ? ' <span class="badge badge-api">API</span>' : ' <span class="badge" style="background:#f59e0b">UA</span>');
  document.getElementById('os-version').textContent = osVer;
  document.getElementById('arch').textContent = arch;
  document.getElementById('model').textContent = model !== '未知' ? model : '（未提供）';
  document.getElementById('browser').textContent = browserName;
  document.getElementById('version').textContent = browserVer;
  document.getElementById('ua').textContent = navigator.userAgent;
}

// ========== 直接获取的 API（不用条件判断） ==========
function directAPIs() {
  document.getElementById('lang').textContent = navigator.language;
  document.getElementById('cookie').textContent = navigator.cookieEnabled ? '✅ 启用' : '❌ 禁用';
  document.getElementById('screen').textContent = screen.width + ' × ' + screen.height;
  document.getElementById('pixel-ratio').textContent = window.devicePixelRatio || 1;
  document.getElementById('cores').textContent = navigator.hardwareConcurrency || '未知';
  document.getElementById('memory').textContent = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '未知';
  document.getElementById('timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');

  // 网络
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conn) {
    document.getElementById('conn-type').textContent = conn.effectiveType || conn.type || '未知';
    document.getElementById('downlink').textContent = conn.downlink ? conn.downlink + ' Mbps' : '未知';
    document.getElementById('rtt').textContent = conn.rtt ? conn.rtt + ' ms' : '未知';
  } else {
    document.getElementById('conn-type').textContent = '不支持';
    document.getElementById('downlink').textContent = '不支持';
    document.getElementById('rtt').textContent = '不支持';
  }

  // GPU
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        document.getElementById('gpu').textContent = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      } else {
        document.getElementById('gpu').textContent = 'WebGL 可用，但无法读取 GPU 型号';
      }
    } else {
      document.getElementById('gpu').textContent = 'WebGL 不可用';
    }
  } catch(e) {
    document.getElementById('gpu').textContent = '检测失败';
  }
}

// ========== IP ==========
function getIP() {
  document.getElementById('ip').textContent = '获取中...';
  fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(d => { document.getElementById('ip').textContent = d.ip; })
    .catch(() => { document.getElementById('ip').textContent = '获取失败'; });
}

// ========== 复制 ==========
function copyAll() {
  const text = `OS: ${document.getElementById('os').textContent}
版本: ${document.getElementById('os-version').textContent}
架构: ${document.getElementById('arch').textContent}
浏览器: ${document.getElementById('browser').textContent} ${document.getElementById('version').textContent}
CPU: ${document.getElementById('cores').textContent} 核
内存: ${document.getElementById('memory').textContent}
屏幕: ${document.getElementById('screen').textContent}
GPU: ${document.getElementById('gpu').textContent}
IP: ${document.getElementById('ip').textContent}
UA: ${navigator.userAgent}`;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  });
}

    document.getElementById('conn-type').textContent = conn.effectiveType || conn.type || '未知';
    document.getElementById('downlink').textContent = conn.downlink ? conn.downlink + ' Mbps' : '未知';
    document.getElementById('rtt').textContent = conn.rtt ? conn.rtt + ' ms' : '未知';
  } else {
    document.getElementById('conn-type').textContent = '不支持';
    document.getElementById('downlink').textContent = '不支持';
    document.getElementById('rtt').textContent = '不支持';
  }

  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        document.getElementById('gpu').textContent = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      } else {
        document.getElementById('gpu').textContent = 'WebGL 可用，无法读取型号';
      }
    } else {
      document.getElementById('gpu').textContent = 'WebGL 不可用';
    }
  } catch(e) {
    document.getElementById('gpu').textContent = '检测失败';
  }
}

function getIP() {
  document.getElementById('ip').textContent = '获取中…';
  fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(d => { document.getElementById('ip').textContent = d.ip; })
    .catch(() => { document.getElementById('ip').textContent = '获取失败'; });
}

function copyAll() {
  const text = `OS: ${document.getElementById('os').textContent}
版本: ${document.getElementById('os-version').textContent}
架构: ${document.getElementById('arch').textContent}
浏览器: ${document.getElementById('browser').textContent} ${document.getElementById('version').textContent}
CPU: ${document.getElementById('cores').textContent} 核
内存: ${document.getElementById('memory').textContent}
屏幕: ${document.getElementById('screen').textContent}
GPU: ${document.getElementById('gpu').textContent}
IP: ${document.getElementById('ip').textContent}`;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  });
}

setInterval(() => {
  document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
}, 1000);

detectAll();
directAPIs();
</script>
