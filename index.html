<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>网站</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
      padding: 50px;
      min-height: 100vh;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    p {
      font-size: 20px;
      opacity: 0.9;
    }
    a {
      color: #ffd700;
      font-size: 18px;
    }
    button {
      background: white;
      color: #764ba2;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>网站</h1>
  <p>Null</p>
  <br>
  <a href="https://github.com" target="_blank">去 GitHub 看看</a>
  <br><br>
  <button onclick="alert('NULL！')">点我试试</button>
</body>
</html>
